<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню | 🍰 Кондитерская</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { font-family: 'Nunito', sans-serif; }
        body { background: #fff5f8; }
        .navbar-sweet {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.1);
            padding: 15px 0;
        }
        .navbar-brand { font-size: 24px; font-weight: 700; color: #d44c66 !important; }
        .btn-cart {
            background: #f48fb1;
            color: white;
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            border: none;
            position: relative;
        }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ec407a;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        .page-title {
            color: #a04055;
            font-weight: 700;
            margin: 30px 0;
            text-align: center;
            font-size: 42px;
        }
        .menu-card {
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(210, 80, 120, 0.1);
            transition: all 0.3s ease;
            height: 100%;
            border: 1px solid #ffe0e8;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 40px rgba(236, 64, 122, 0.15);
        }
        .menu-icon {
            font-size: 50px;
            margin-bottom: 15px;
            color: #ec407a;
        }
        .menu-name {
            font-size: 24px;
            font-weight: 700;
            color: #9c4668;
        }
        .menu-desc {
            color: #888;
            min-height: 50px;
            margin: 10px 0;
        }
        .menu-price {
            font-size: 28px;
            font-weight: 800;
            color: #d81b60;
            margin: 15px 0;
        }
        .btn-add {
            background: linear-gradient(135deg, #f8bbd0 0%, #f48fb1 100%);
            color: white;
            border-radius: 50px;
            padding: 12px;
            font-weight: 700;
            border: none;
            width: 100%;
            transition: all 0
