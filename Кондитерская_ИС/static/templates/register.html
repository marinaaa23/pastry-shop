<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | 🍰 Кондитерская</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Nunito', sans-serif; }
        body {
            background: linear-gradient(145deg, #f3e5f5 0%, #e1bee7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        .cake-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 45px;
            box-shadow: 0 25px 50px -12px rgba(142, 36, 170, 0.2);
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        h1 {
            color: #7b1fa2;
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .pastel-input {
            border: 2px solid #e1bee7;
            border-radius: 40px;
            padding: 14px 22px;
            background: #fff9fb;
            font-size: 16px;
            transition: all 0.3s;
        }
        .pastel-input:focus {
            border-color: #ab47bc;
            box-shadow: 0 0 0 4px rgba(171, 71, 188, 0.15);
            outline: none;
            background: white;
        }
        .btn-sweet {
            background: linear-gradient(135deg, #ce93d8 0%, #ab47bc 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 16px 20px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 10px 20px -5px rgba(171, 71, 188, 0.3);
            transition: all 0.3s;
        }
        .btn-sweet:hover {
            background: linear-gradient(135deg, #ba68c8 0%, #8e24aa 100%);
            transform: scale(1.02);
            color: white;
        }
        .captcha-box {
            background: #f3e5f5;
            border-radius: 40px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .captcha-question {
            font-size: 32px;
            font-weight: 800;
            color: #6a1b9a;
            letter-spacing: 3px;
        }
        .login-link {
            color: #8e24aa;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px dotted #ce93d8;
        }
        .login-link:hover {
            color: #4a148c;
            border-bottom: 2px solid #ab47bc;
        }
        .alert {
            border-radius: 50px;
            border: none;
            font-weight: 600;
            padding: 12px 20px;
        }
        .icon-large {
            font-size: 60px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="cake-card">
                    <div class="text-center">
                        <div class="icon-large">🍰🌸</div>
                        <h1>Регистрация</h1>
                        <p class="text-muted mb-4">Присоединяйтесь к нашей сладкой семье!</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">👤 Придумайте логин</label>
                            <input type="text" name="username" class="form-control pastel-input" placeholder="Логин" required minlength="3">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">🔐 Придумайте пароль</label>
                            <input type="password" name="password" class="form-control pastel-input" placeholder="Минимум 4 символа" required minlength="4">
                        </div>
                        
                        <div class="captcha-box">
                            <label class="fw-bold text-secondary mb-2">🤖 Решите пример</label>
                            <div class="captcha-question">{{ captcha_question }}</div>
                            <input type="number" name="captcha" class="form-control pastel-input text-center mt-2" placeholder="Ваш ответ" required>
                        </div>

                        <button type="submit" class="btn btn-sweet w-100 mt-3">🎂 Зарегистрироваться</button>
                    </form>

                    <div class="text-center mt-4">
                        <span class="text-secondary">Уже есть аккаунт?</span>
                        <a href="{{ url_for('login') }}" class="login-link ms-2">Войти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
