<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | Кондитерская</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { font-family: 'Nunito', sans-serif; }
        body { background: linear-gradient(135deg, #fff5f8 0%, #ffe4ed 100%); min-height: 100vh; }
        .navbar-sweet { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); box-shadow: 0 5px 20px rgba(255, 105, 180, 0.1); padding: 15px 0; }
        .navbar-brand { font-size: 24px; font-weight: 700; color: #d44c66 !important; text-decoration: none; }
        .welcome-text { color: #a04055; font-weight: 600; font-size: 18px; }
        .btn-outline-sweet { border: 2px solid #f8bbd0; color: #c2185b; border-radius: 50px; padding: 10px 25px; font-weight: 600; text-decoration: none; }
        .btn-outline-sweet:hover { background: #f8bbd0; color: #880e4f; }
        .dashboard-card { background: white; border-radius: 30px; padding: 35px 25px; box-shadow: 0 15px 35px -10px rgba(210, 80, 120, 0.15); text-decoration: none; color: #333; display: block; height: 100%; text-align: center; }
        .dashboard-card:hover { transform: translateY(-8px); box-shadow: 0 25px 45px -10px rgba(236, 64, 122, 0.25); color: #333; }
        .card-icon { font-size: 55px; color: #ec407a; margin-bottom: 20px; }
        .card-title { font-size: 24px; font-weight: 700; color: #9c4668; margin-bottom: 10px; }
        .card-text { color: #888; font-size: 15px; }
        .greeting { background: linear-gradient(135deg, #f8bbd0 0%, #f48fb1 100%); border-radius: 60px; padding: 15px 30px; color: white; display: inline-block; margin-bottom: 30px; }
    </style>
</head>
<body>
    <nav class="navbar-sweet">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="#" class="navbar-brand">🧁 Сладкий уголок</a>
            <div class="d-flex align-items-center">
                <span class="welcome-text me-4">Привет, {{ username }}!</span>
                <a href="{{ url_for('logout') }}" class="btn-outline-sweet">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="greeting"><h3 class="mb-0">🍰 Чем сегодня порадуем себя?</h3></div>
        
        <div class="row g-4 mt-3">
            <div class="col-md-4">
                <a href="{{ url_for('menu') }}" class="dashboard-card">
                    <div class="card-icon">🍩</div>
                    <div class="card-title">Меню</div>
                    <div class="card-text">Пирожные, торты, десерты</div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="{{ url_for('cart') }}" class="dashboard-card">
                    <div class="card-icon">🛒</div>
                    <div class="card-title">Корзина</div>
                    <div class="card-text">Оформить заказ</div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="{{ url_for('my_orders') }}" class="dashboard-card">
                    <div class="card-icon">📦</div>
                    <div class="card-title">Мои заказы</div>
                    <div class="card-text">История и статусы</div>
                </a>
            </div>
        </div>

        <div class="mt-5 p-5 rounded-5 text-white" style="background: linear-gradient(135deg, #f8bbd0 0%, #f06292 100%);">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h2 style="color:white;">🎉 Сладкая акция!</h2>
                    <p class="lead mb-0">При заказе от 1500 руб. — макарон в подарок!</p>
                </div>
                <div class="col-md-4 text-end"><span style="font-size:70px;">🎁</span></div>
            </div>
        </div>
    </div>
</body>
</html>
