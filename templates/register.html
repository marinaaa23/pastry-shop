<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | 🍰 Кондитерская</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Nunito', sans-serif; }
        body { background: linear-gradient(145deg, #f3e5f5 0%, #e1bee7 100%); min-height: 100vh; display: flex; align-items: center; padding: 20px; }
        .cake-card { background: rgba(255, 255, 255, 0.95); border-radius: 45px; box-shadow: 0 25px 50px -12px rgba(142, 36, 170, 0.2); padding: 40px 30px; }
        h1 { color: #7b1fa2; font-weight: 700; font-size: 2.2rem; }
        .pastel-input { border: 2px solid #e1bee7; border-radius: 40px; padding: 14px 22px; background: #fff9fb; font-size: 16px; width: 100%; }
        .pastel-input:focus { border-color: #ab47bc; box-shadow: 0 0 0 4px rgba(171, 71, 188, 0.15); outline: none; }
        .btn-sweet { background: linear-gradient(135deg, #ce93d8 0%, #ab47bc 100%); color: white; border: none; border-radius: 50px; padding: 16px 20px; font-weight: 700; font-size: 18px; width: 100%; cursor: pointer; }
        .captcha-box { background: #f3e5f5; border-radius: 40px; padding: 20px; margin: 20px 0; text-align: center; }
        .captcha-question { font-size: 32px; font-weight: 800; color: #6a1b9a; letter-spacing: 3px; }
        .login-link { color: #8e24aa; font-weight: 700; text-decoration: none; }
        .alert { border-radius: 50px; border: none; font-weight: 600; padding: 12px 20px; }
        .alert-danger { background: #ffebee; color: #c62828; }
        .icon-large { font-size: 60px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container"><div class="row justify-content-center"><div class="col-md-5 col-lg-4"><div class="cake-card">
        <div class="text-center"><div class="icon-large">🍰🌸</div><h1>Регистрация</h1><p class="text-muted mb-4">Присоединяйтесь!</p></div>
        {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">{{ message }}</div>{% endfor %}{% endwith %}
        <form method="POST">
            <div class="mb-3"><label class="form-label fw-bold text-secondary">👤 Логин</label><input type="text" name="username" class="pastel-input" required minlength="3"></div>
            <div class="mb-3"><label class="form-label fw-bold text-secondary">🔐 Пароль</label><input type="password" name="password" class="pastel-input" required minlength="4"></div>
            <div class="captcha-box"><label class="fw-bold text-secondary mb-2">🤖 Решите пример</label><div class="captcha-question">{{ captcha_question }}</div><input type="number" name="captcha" class="pastel-input text-center mt-2" required></div>
            <button type="submit" class="btn btn-sweet mt-3">🎂 Зарегистрироваться</button>
        </form>
        <div class="text-center mt-4"><span class="text-secondary">Уже есть аккаунт?</span><a href="{{ url_for('login') }}" class="login-link ms-2">Войти</a></div>
    </div></div></div></div>
</body>
</html>
